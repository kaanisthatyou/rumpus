name: Release

# Pushing a tag like v0.2.0-alpha.1 builds the installers and uploads them to a GitHub release, which is
# where the app's updater looks. The tag must match apps/desktop/package.json's version.
on:
  push:
    tags: ['v*']

# Actions are pinned to commits (the tag is in the comment): this workflow may write releases, so a moved tag
# must not be able to change what runs in it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./apps/desktop/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - name: Build and publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../../scripts/notices.mjs && pnpm exec electron-vite build && pnpm exec electron-builder --config electron-builder.yml --publish always
