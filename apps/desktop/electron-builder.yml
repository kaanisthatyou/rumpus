appId: io.github.kaanisthatyou.serai
productName: Serai
copyright: Copyright 2026 Serai contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# The workspace package is "@lonca/desktop"; inside the app it is plain "serai", which names the install folder
# (%LOCALAPPDATA%\Programs\lonca) and the updater cache.
extraMetadata:
  name: serai

# Invite links: serai://join/<code> opens the app with the join dialog.
protocols:
  - name: Serai invite
    schemes:
      - serai

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Serai-Setup-${version}.${ext}

nsis:
  # Per-user install without admin rights, like Discord or VS Code's user installer.
  oneClick: true
  perMachine: false
  shortcutName: Serai
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Serai contributors <kaanisthatyou@users.noreply.github.com>
  artifactName: Serai-${version}-${arch}.${ext}

publish:
  provider: github
  owner: kaanisthatyou
  repo: lonca
  releaseType: release
