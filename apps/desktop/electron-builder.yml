appId: io.github.kaanisthatyou.rumpus
productName: Rumpus
copyright: Copyright 2026 Rumpus contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# The licenses of the packages whose code and fonts are inside the app (scripts/notices.mjs writes the file).
extraResources:
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
# The workspace package is "@lonca/desktop"; inside the app it is plain "rumpus", which names the install folder
# (%LOCALAPPDATA%\Programs\rumpus) and the updater cache.
extraMetadata:
  name: rumpus

# Invite links: rumpus://join/<code> opens the app with the join dialog.
protocols:
  - name: Rumpus invite
    schemes:
      - rumpus

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Rumpus-Setup-${version}.${ext}

nsis:
  # Per-user install without admin rights, like Discord or VS Code's user installer.
  oneClick: true
  perMachine: false
  shortcutName: Rumpus
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Rumpus contributors <kaanisthatyou@users.noreply.github.com>
  artifactName: Rumpus-${version}-${arch}.${ext}

publish:
  provider: github
  owner: kaanisthatyou
  repo: lonca
  releaseType: release
